<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ülke Tahmin</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f2e8cf; /* İstediğin Bej Renk Kodu */
            color: #000;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* Ana Düzen */
        .app-container {
            width: 100%;
            max-width: 850px;
        }

        /* Üst Menü (Header) */
        .header {
            background-color: #fdfbf7;
            border: 3px solid #000;
            border-radius: 18px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 4px 4px 0px #000;
            margin-bottom: 35px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .profile-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .profile-icon {
            width: 28px;
            height: 28px;
            border: 2px solid #000;
            border-radius: 50%;
            padding: 2px;
        }

        .games-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Oyun Kartı */
        .game-card {
            width: 210px;
            height: 210px;
            background-color: #8ce1a6;
            border: 3px solid #000;
            border-radius: 20px;
            box-shadow: 5px 5px 0px #000;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            overflow: hidden;
            
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .game-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0px #000;
        }

        .game-card:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0px #000;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Üst Bar -->
        <header class="header">
            <div class="logo-container">
                <svg class="logo-icon" viewBox="0 0 100 100" fill="none">
                    <circle cx="50" cy="50" r="38" stroke="#000" stroke-width="5" fill="#fcfbf7"/>
                    <polygon points="50,18 62,50 50,82 38,50" fill="#fff" stroke="#000" stroke-width="3"/>
                    <polygon points="50,18 62,50 50,50" fill="#000"/>
                    <polygon points="50,50 38,50 50,82" fill="#000"/>
                    <path d="M58 22 C58 15 50 12 50 20 C50 27 58 32 58 32 C58 32 66 27 66 20 C66 15 58 15 58 22 Z" fill="#e63946" stroke="#000" stroke-width="2"/>
                </svg>
                <span class="logo-text">Ülke Tahmin</span>
            </div>
            
            <button class="profile-btn">
                <span>Profil</span>
                <svg class="profile-icon" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
        </header>

        <!-- İçerik -->
        <main>
            <div class="games-grid">
                <a href="https://ulketahmin.xyz/geodle.html" class="game-card">
                    <img src="ulke-tahmin.jpg.png" alt="Ülke Tahmin Oyunu">
                </a>
            </div>
        </main>
    </div>

</body>
</html>
