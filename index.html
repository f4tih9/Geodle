<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ülke Tahmin</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f7f4ea;
            color: #000;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* Ana Çerçeve */
        .app-container {
            width: 100%;
            max-width: 900px;
            background-color: #f7f4ea;
            border: 3.5px solid #000;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 8px 8px 0px #000;
            min-height: 500px;
        }

        /* Üst Menü (Header) */
        .header {
            background-color: #fcfbf7;
            border: 3px solid #000;
            border-radius: 18px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 4px 4px 0px #000;
            margin-bottom: 28px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .profile-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .profile-icon {
            width: 28px;
            height: 28px;
            border: 2px solid #000;
            border-radius: 50%;
            padding: 2px;
        }

        /* Başlık */
        .section-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        /* Oyun Kartı (Tıklanabilir Buton) */
        .game-card {
            width: 220px;
            height: 220px;
            background-color: #52e085; /* Yeşil zemin */
            border: 3.5px solid #000;
            border-radius: 20px;
            box-shadow: 6px 6px 0px #000;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-decoration: none;
            color: #000;
            user-select: none;
            
            /* Animasyon Süresi Yumuşatıldı */
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), 
                        box-shadow 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Hover (Üzerine Gelince) Efekti */
        .game-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0px #000;
        }

        /* Active (Basılınca İçeri Çökme) Animasyonu */
        .game-card:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px #000;
        }

        /* Kart İçindeki SVG Çizim */
        .game-card-img {
            width: 100%;
            height: 125px;
        }

        .game-card-title {
            font-size: 20px;
            font-weight: 800;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Üst Bar -->
        <header class="header">
            <div class="logo-container">
                <!-- Pusula ve Kırmızı Pin Logosu -->
                <svg class="logo-icon" viewBox="0 0 100 100" fill="none">
                    <circle cx="50" cy="50" r="38" stroke="#000" stroke-width="5" fill="#fcfbf7"/>
                    <polygon points="50,18 62,50 50,82 38,50" fill="#fff" stroke="#000" stroke-width="3"/>
                    <polygon points="50,18 62,50 50,50" fill="#000"/>
                    <polygon points="50,50 38,50 50,82" fill="#000"/>
                    <path d="M58 22 C58 15 50 12 50 20 C50 27 58 32 58 32 C58 32 66 27 66 20 C66 15 58 15 58 22 Z" fill="#e63946" stroke="#000" stroke-width="2"/>
                </svg>
                <span class="logo-text">Ülke Tahmin</span>
            </div>
            
            <button class="profile-btn">
                <span>Profil</span>
                <svg class="profile-icon" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
        </header>

        <!-- İçerik -->
        <main>
            <h2 class="section-title">Günlük Oyunlar</h2>
            
            <div class="games-grid">
                <!-- Oyun Yönlendirme Linki -->
                <a href="https://ulketahmin.xyz/geodle.html" class="game-card">
                    <!-- Dahili SVG Harita Çizimi -->
                    <svg class="game-card-img" viewBox="0 0 200 120" fill="none">
                        <!-- Kıta Çizgileri -->
                        <path d="M 25 35 Q 35 25 55 35 Q 65 40 50 60 Q 30 65 25 35 Z" fill="#d0e2b4" stroke="#000" stroke-width="1.5"/>
                        <path d="M 60 65 Q 70 55 80 70 Q 75 90 60 85 Z" fill="#d0e2b4" stroke="#000" stroke-width="1.5"/>
                        <path d="M 90 30 Q 120 25 140 40 Q 160 50 145 75 Q 110 70 90 30 Z" fill="#d0e2b4" stroke="#000" stroke-width="1.5"/>
                        <path d="M 145 80 Q 165 75 170 90 Q 150 95 145 80 Z" fill="#d0e2b4" stroke="#000" stroke-width="1.5"/>
                        
                        <!-- Bayraklar -->
                        <g transform="translate(95, 12)">
                            <rect width="14" height="9" fill="#e63946" stroke="#000" stroke-width="1"/>
                            <circle cx="5" cy="4.5" r="2" fill="#fff"/>
                            <circle cx="5.8" cy="4.5" r="1.5" fill="#e63946"/>
                        </g>

                        <g transform="translate(125, 20)">
                            <rect width="14" height="9" fill="#fff" stroke="#000" stroke-width="1"/>
                            <rect width="4.6" height="9" fill="#0055a5"/>
                            <rect x="9.4" width="4.6" height="9" fill="#ed2939"/>
                        </g>
                        
                        <!-- Büyüteç ve Soru İşareti -->
                        <g transform="translate(5, -5)">
                            <circle cx="90" cy="55" r="26" fill="#f7f4ea" stroke="#000" stroke-width="3.5"/>
                            <line x1="108" y1="73" x2="132" y2="97" stroke="#000" stroke-width="6.5" stroke-linecap="round"/>
                            <text x="83" y="65" font-family="sans-serif" font-weight="900" font-size="28" fill="#000">?</text>
                        </g>
                    </svg>

                    <span class="game-card-title">Ülke Tahmin</span>
                </a>
            </div>
        </main>
    </div>

</body>
</html>
